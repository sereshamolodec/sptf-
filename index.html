<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Плеер">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Мой плеер</title>
<style>
:root{--bg:#0b0b0f;--card:#16161c;--card2:#1f1f28;--text:#f5f5f7;--muted:#9c9ca8;--accent:#a78bfa;--accent2:#f472b6;--danger:#ff6b6b;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{fill:currentColor;display:block}
#app{max-width:720px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(110px + var(--sab))}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:28px;letter-spacing:-.5px}
.muted{color:var(--muted)}
#stats{font-size:13px;margin:2px 0 14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#12091f;cursor:pointer}
.pill.ghost{background:var(--card2);color:var(--text)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
input[type=search],select{background:var(--card);color:var(--text);border:1px solid #2a2a35;border-radius:12px;padding:10px 12px;font:inherit;outline:none;-webkit-user-select:text;user-select:text}
input[type=search]{flex:1;min-width:0}
select{max-width:42%}
.actions{display:flex;gap:8px;margin-bottom:8px}
.actions .pill{flex:1;justify-content:center}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:12px}
.row:active{background:var(--card)}
.row.cur .t{color:var(--accent)}
.th{width:48px;height:48px;border-radius:8px;flex:none;background:var(--card2);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.th img{width:100%;height:100%;object-fit:cover}
.th svg{width:22px;height:22px}
.meta{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.more{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.more svg{width:20px;height:20px}
#empty{text-align:center;padding:56px 16px;color:var(--muted)}
#empty .big{width:88px;height:88px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#12091f}
#empty .big svg{width:44px;height:44px}
#empty h2{color:var(--text);margin:0 0 6px}
#empty .pill{margin-top:18px}
/* albums */
.ahead{display:flex;align-items:center;gap:12px;padding:18px 4px 8px;margin-top:6px;border-bottom:1px solid #22222b}
.ahead .th{width:56px;height:56px;border-radius:10px}
.ahead .meta{cursor:pointer}
.ahead .t{font-size:17px}
.th.num{background:none;width:28px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;color:var(--muted)}
.row.cur .th.num{color:var(--accent)}
#sheet input{display:block;width:100%;margin:4px 0 10px;background:var(--card2);color:var(--text);border:1px solid #2f2f3a;border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;outline:none}
#sheet label.fl{font-size:12px;color:var(--muted);display:block;margin-top:4px}
#sheet .two{display:flex;gap:10px}
#sheet .two>div{flex:1}
#sheet button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#12091f;border-radius:12px;text-align:center;font-weight:600;border-top:0;margin-top:6px}
#reorder{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--sat) + 12px) 16px calc(var(--sab) + 12px)}
#reorder.show{display:flex}
#reorder h3{margin:4px 0 2px}
#rolist{flex:1;overflow:auto;margin:8px 0;position:relative}
.ro{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #1d1d25;background:var(--bg);height:62px}
.ro.shift{transition:transform .15s}
.ro.drag{background:var(--card2);box-shadow:0 8px 24px rgba(0,0,0,.55);position:relative;z-index:3;border-radius:10px}
.ro .n{width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.ro .meta{flex:1;min-width:0}
.ro button{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:var(--card2);flex:none}
.ro button svg{width:18px;height:18px}
.ro .ck{width:22px;height:22px;accent-color:#a78bfa;flex:none}
.grip{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none}
.grip svg{width:24px;height:24px}
#roForm input{display:block;width:100%;margin:0 0 8px;background:var(--card2);color:var(--text);border:1px solid #2f2f3a;border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;outline:none}
.rob{display:flex;gap:10px}
.rob .pill{flex:1;justify-content:center}
/* mini player */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;padding:0 10px calc(var(--sab) + 8px)}
#mini.show{display:block}
.mini-in{max-width:700px;margin:0 auto;background:rgba(31,31,40,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.mini-in .th{width:44px;height:44px}
.mini-prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ibtn svg{width:26px;height:26px}
/* full player */
#full{position:fixed;inset:0;z-index:30;background:linear-gradient(180deg,#2a1d4a 0%,#0b0b0f 70%);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(var(--sat) + 10px) 24px calc(var(--sab) + 24px);overflow:hidden}
#full.open{transform:none}
.fclose{align-self:flex-start;width:44px;height:44px;display:grid;place-items:center;margin-left:-10px}
.fclose svg{width:28px;height:28px}
.cover{width:min(100%,46vh);aspect-ratio:1;margin:auto;border-radius:18px;background:var(--card2);display:grid;place-items:center;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);color:var(--muted)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover svg{width:30%;height:30%}
.finfo{margin-top:18px}
.finfo .t{font-size:22px}
.finfo .a{font-size:16px}
.seek{margin-top:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p),#3a3a46 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctrls .ibtn{width:56px;height:56px}
.ctrls .ibtn svg{width:30px;height:30px}
.ctrls .main{width:72px;height:72px;background:#fff;color:#111}
.ctrls .main svg{width:36px;height:36px}
.ctrls .on{color:var(--accent)}
.ctrls .sm svg{width:24px;height:24px}
/* громкость: только на компьютере (на iPhone громкость задают кнопками телефона) */
.vol{display:none;align-items:center;gap:4px}
@media (hover:hover) and (pointer:fine){.vol{display:flex}}
.vol .vbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.vol .vbtn:hover{color:var(--text)}
.vol .vbtn svg{width:22px;height:22px}
.vol input[type=range]{width:96px;height:24px;cursor:pointer}
#full .vol{justify-content:center;margin-top:10px}
#full .vol input[type=range]{width:220px}
/* sheet */
#sheetbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none}
#sheetbg.show{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(var(--sab) + 16px);max-width:720px;margin:0 auto}
#sheet .sh-title{font-weight:600;margin-bottom:2px}
#sheet .sh-sub{font-size:13px;color:var(--muted);margin-bottom:10px}
#sheet button{display:block;width:100%;text-align:left;padding:14px 8px;border-top:1px solid #26262f;font-size:17px}
#sheet button.danger{color:var(--danger)}
/* toast / tip */
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 96px);transform:translate(-50%,200%);z-index:60;background:#2b2b36;padding:10px 16px;border-radius:999px;font-size:14px;transition:transform .25s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{transform:translate(-50%,0)}
#tip{background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:none;gap:10px;align-items:flex-start}
#tip.show{display:flex}
#tip b{color:var(--accent)}
#tip button{margin-left:auto;color:var(--muted);font-size:20px;line-height:1}
</style>
</head>
<body>
<div id="app">
  <div class="title-row">
    <h1>Моя музыка</h1>
    <label class="pill" for="file"><span id="plus">＋</span> Добавить</label>
    <input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.aiff,.caf" multiple hidden>
  </div>
  <div id="stats" class="muted"></div>
  <div id="tip"><div>Чтобы музыка не пропадала и приложение работало как настоящее: нажми <b>«Поделиться»</b> в Safari → <b>«На экран “Домой”»</b> и открывай плеер с иконки.</div><button id="tipx" aria-label="Закрыть">×</button></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Поиск" autocomplete="off">
    <select id="sort"><option value="album">Альбомы</option><option value="added">Новые</option><option value="title">По названию</option><option value="artist">По исполнителю</option></select>
  </div>
  <div class="actions">
    <button class="pill" id="playAll"></button>
    <button class="pill ghost" id="shuffleAll"></button>
  </div>
  <div id="list"></div>
  <div id="empty" style="display:none">
    <div class="big" id="emptyIcon"></div>
    <h2>Пока пусто</h2>
    <div>Добавь музыку из приложения «Файлы» на iPhone.<br>Треки сохранятся в памяти телефона и будут играть без интернета.</div>
    <label class="pill" for="file">＋ Добавить музыку</label>
  </div>
</div>

<div id="mini">
  <div class="mini-in">
    <div class="th" id="miniTh"></div>
    <div class="meta" id="miniOpen"><div class="t" id="miniT"></div><div class="a" id="miniA"></div></div>
    <div class="vol" id="miniVol"></div>
    <button class="ibtn" id="miniPlay" aria-label="Пауза/воспроизведение"></button>
    <button class="ibtn" id="miniNext" aria-label="Следующий"></button>
    <div class="mini-prog" id="miniProg"></div>
  </div>
</div>

<div id="full">
  <button class="fclose" id="fclose" aria-label="Свернуть"></button>
  <div class="cover" id="cover"></div>
  <div class="finfo"><div class="t" id="fT"></div><div class="a" id="fA"></div></div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0">
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  </div>
  <div class="ctrls">
    <button class="ibtn sm" id="bShuffle" aria-label="Перемешать"></button>
    <button class="ibtn" id="bPrev" aria-label="Предыдущий"></button>
    <button class="ibtn main" id="bPlay" aria-label="Пауза/воспроизведение"></button>
    <button class="ibtn" id="bNext" aria-label="Следующий"></button>
    <button class="ibtn sm" id="bRepeat" aria-label="Повтор"></button>
  </div>
  <div class="vol" id="fullVol"></div>
</div>

<div id="sheetbg"><div id="sheet"></div></div>
<div id="reorder">
  <h3 id="roTitle"></h3>
  <div class="muted" id="roHint" style="font-size:13px;margin-bottom:6px"></div>
  <div id="roForm" style="display:none"><input id="roAlbum" placeholder="Название альбома" autocomplete="off"><input id="roArtist" placeholder="Исполнитель альбома (необязательно)" autocomplete="off"></div>
  <div id="rolist"></div>
  <div class="rob"><button class="pill ghost" id="roCancel">Отмена</button><button class="pill" id="roSave">Сохранить</button></div>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const ICON = {
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM17 6h2v12h-2z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M18 6v12l-9-6zM5 6h2v12H5z"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/></svg>',
  repeat1:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/><text x="12" y="15.5" font-size="8" text-anchor="middle" fill="currentColor" stroke="none" font-weight="700">1</text></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>',
  vol2:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  vol1:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.5 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 8h14M5 12h14M5 16h14"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  note:'<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3z"/></svg>'
};

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtSize = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' ГБ' : b >= 1e6 ? Math.round(b / 1e6) + ' МБ' : Math.round(b / 1e3) + ' КБ';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- IndexedDB ---------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('player-db', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('meta', { keyPath: 'id', autoIncrement: true });
      d.createObjectStore('files');
      d.createObjectStore('covers');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const getAllMeta = () => new Promise((res, rej) => { const r = db.transaction('meta').objectStore('meta').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getByKey = (store, id) => new Promise((res, rej) => { const r = db.transaction(store).objectStore(store).get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
function addTrack(meta, file, cover) {
  return new Promise((res, rej) => {
    const t = db.transaction(['meta', 'files', 'covers'], 'readwrite');
    const r = t.objectStore('meta').add(meta);
    r.onsuccess = () => {
      meta.id = r.result;
      t.objectStore('files').put(file, meta.id);
      if (cover) t.objectStore('covers').put(cover, meta.id);
    };
    t.oncomplete = () => res(meta);
    t.onerror = t.onabort = () => rej(t.error || new Error('db'));
  });
}
function deleteTrack(id) {
  return new Promise((res, rej) => {
    const t = db.transaction(['meta', 'files', 'covers'], 'readwrite');
    t.objectStore('meta').delete(id); t.objectStore('files').delete(id); t.objectStore('covers').delete(id);
    t.oncomplete = () => res(); t.onerror = t.onabort = () => rej(t.error);
  });
}

/* ---------- tag reading (ID3v2 for mp3, MP4 atoms for m4a) ---------- */
// <tags>
const latin1 = u8 => { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return s; };
function dec(label, u8) { try { return new TextDecoder(label).decode(u8); } catch (e) { return latin1(u8); } }
function decodeId3Text(d) {
  if (!d.length) return '';
  const enc = d[0], body = d.subarray(1);
  let s;
  if (enc === 0) s = dec('windows-1251', body);
  else if (enc === 1) {
    if (body[0] === 0xFE && body[1] === 0xFF) s = dec('utf-16be', body.subarray(2));
    else if (body[0] === 0xFF && body[1] === 0xFE) s = dec('utf-16le', body.subarray(2));
    else s = dec('utf-16le', body);
  } else if (enc === 2) s = dec('utf-16be', body);
  else s = dec('utf-8', body);
  return s.replace(/\u0000.*$/s, '').trim();
}
function parseApic(d) {
  const enc = d[0]; let p = 1;
  const me = d.indexOf(0, p); if (me < 0) return null;
  let mime = latin1(d.subarray(p, me)); p = me + 1;
  p++; // picture type
  if (enc === 1 || enc === 2) { while (p + 1 < d.length && !(d[p] === 0 && d[p + 1] === 0)) p += 2; p += 2; }
  else { while (p < d.length && d[p] !== 0) p++; p++; }
  if (p >= d.length) return null;
  if (!mime.includes('/')) mime = 'image/jpeg';
  return new Blob([d.slice(p)], { type: mime });
}
async function readId3(file) {

async function importFiles(fileList) {

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    toast(`Добавляю ${i + 1} из ${files.length}…`, 60000);
    if (tracks.some(t => t.fname === f.name && t.size === f.size)) { skipped++; continue; }
    try {

audio.addEventListener('seeked', () => updatePosition(true));
audio.addEventListener('ended', () => { if (audio.src === silentUrl) return; next(true); });
audio.addEventListener('error', () => {
  if (!curId || audio.src === silentUrl) return;
  toast('Не удалось воспроизвести этот файл');
  if (++errStreak < 3 && order.length > 1) next(true);
});

if ('mediaSession' in navigator) {
  const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  set('play', () => audio.play().catch(() => {}));
  set('pause', () => audio.pause());
  set('previoustrack', prev);
  set('nexttrack', () => next(false));
  set('seekto', d => { if (d.seekTime != null) { audio.currentTime = d.seekTime; updatePosition(true); } });
  set('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  set('seekforward', d => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + (d.seekOffset || 10)); });
}

/* ---------- громкость (ПК) ---------- */
let volume = parseFloat(lsGet('volume')); if (!(volume >= 0 && volume <= 1)) volume = 1;
let muted = false;
function applyVolume() {
  const eff = muted ? 0 : volume;
  audio.volume = eff;
  document.querySelectorAll('.vol').forEach(v => {
    const r = v.querySelector('.vrange'); r.value = Math.round(eff * 100); r.style.setProperty('--p', r.value + '%');
    v.querySelector('.vbtn').innerHTML = eff === 0 ? ICON.mute : eff < 0.5 ? ICON.vol1 : ICON.vol2;
  });
}
document.querySelectorAll('.vol').forEach(v => {
  v.innerHTML = '<button class="vbtn" aria-label="Выключить звук"></button><input class="vrange" type="range" min="0" max="100" value="100" aria-label="Громкость">';
  v.querySelector('.vrange').addEventListener('input', e => { volume = e.target.value / 100; muted = false; applyVolume(); lsSet('volume', String(volume)); });
  v.querySelector('.vbtn').addEventListener('click', e => { e.stopPropagation(); if (volume === 0) { volume = 0.5; muted = false; lsSet('volume', '0.5'); } else muted = !muted; applyVolume(); });
  v.addEventListener('wheel', e => { e.preventDefault(); volume = Math.max(0, Math.min(1, (muted ? 0 : volume) + (e.deltaY < 0 ? 0.05 : -0.05))); muted = false; applyVolume(); lsSet('volume', String(volume)); }, { passive: false });
  v.addEventListener('click', e => e.stopPropagation());
});
applyVolume();

/* ---------- UI wiring ---------- */
$('#playAll').innerHTML = ICON.play.replace('<svg', '<svg width="18" height="18"') + ' Играть';
$('#shuffleAll').innerHTML = ICON.shuffle.replace('<svg', '<svg width="18" height="18"') + ' Перемешать';
$('#emptyIcon').innerHTML = ICON.note;
$('#fclose').innerHTML = ICON.down;
$('#miniNext').innerHTML = ICON.next;
$('#bPrev').innerHTML = ICON.prev; $('#bNext').innerHTML = ICON.next;

$('#playAll').onclick = () => { shuffleOn = false; updateButtons(); const ids = visibleTracks().map(t => t.id); startQueue(ids, ids[0]); };
$('#shuffleAll').onclick = () => { shuffleOn = true; updateButtons(); startQueue(visibleTracks().map(t => t.id), null); };
$('#list').addEventListener('click', e => {
  const moreG = e.target.closest('[data-more-g]');
  if (moreG) { openAlbumSheet(Number(moreG.dataset.moreG)); return; }
  const reG = e.target.closest('[data-reorder-g]');
  if (reG) { openReorder(Number(reG.dataset.reorderG)); return; }
  const head = e.target.closest('.ahead');
  if (head) { playGroup(Number(head.dataset.g)); return; }
  const more = e.target.closest('[data-more]');
  if (more) { openSheet(Number(more.dataset.more)); return; }
  const row = e.target.closest('.row'); if (!row) return;
  const id = Number(row.dataset.id);
  startQueue(visibleTracks().map(t => t.id), id);
});
$('#q').addEventListener('input', render);
$('#sort').addEventListener('change', () => { lsSet('sort', $('#sort').value); render(); });
$('#miniPlay').onclick = e => { e.stopPropagation(); toggle(); };
$('#miniNext').onclick = e => { e.stopPropagation(); next(false); };
$('#miniOpen').onclick = () => $('#full').classList.add('open');
$('#miniTh').onclick = () => $('#full').classList.add('open');
$('#fclose').onclick = () => $('#full').classList.remove('open');
$('#bPlay').onclick = toggle;
$('#bNext').onclick = () => next(false);
$('#bPrev').onclick = prev;
$('#bShuffle').onclick = () => setShuffle(!shuffleOn);
$('#bRepeat').onclick = () => setRepeat((repeatMode + 1) % 3);
const sk = $('#seek');
sk.addEventListener('pointerdown', () => { seeking = true; });
sk.addEventListener('input', () => {
  const d = audio.duration; if (!isFinite(d)) return;
  sk.style.setProperty('--p', sk.value / 10 + '%'); $('#tCur').textContent = fmtTime(sk.value / 1000 * d);
});
sk.addEventListener('change', () => {
  const d = audio.duration; if (isFinite(d)) audio.currentTime = sk.value / 1000 * d;
  seeking = false; updatePosition(true);
});
sk.addEventListener('pointerup', () => { seeking = false; });
sk.addEventListener('pointercancel', () => { seeking = false; });

/* track menu */
function openSheet(id) {
  const t = byId(id); if (!t) return;
  $('#sheet').innerHTML = `<div class="sh-title">${esc(t.title)}</div><div class="sh-sub">${esc(t.artist || 'Неизвестный исполнитель')}${t.album ? ' · ' + esc(t.album) : ''} · ${fmtSize(t.size || 0)}</div>
    <button data-act="next">Играть следующим</button>
    <button data-act="edit">Изменить данные (название, альбом, номер)</button>
    <button data-act="delete" class="danger">Удалить с телефона</button>
    <button data-act="cancel">Отмена</button>`;
  $('#sheet').dataset.id = id; $('#sheet').dataset.g = '';
  $('#sheetbg').classList.add('show');
}
function openAlbumSheet(gi) {
  const o = lastGroups[gi]; if (!o) return;
  $('#sheet').innerHTML = `<div class="sh-title">${esc(o.name || 'Без альбома')}</div><div class="sh-sub">${esc(o.artist || '')} · ${o.ids.length} ${plural(o.ids.length)}</div>
    <button data-act="aplay">Играть по порядку</button>
    <button data-act="areorder">${o.key ? 'Поменять треки местами' : 'Собрать альбом из этих треков'}</button>
    ${o.key ? '<button data-act="arename">Название и исполнитель альбома</button>' : ''}
    <button data-act="cancel">Отмена</button>`;
  $('#sheet').dataset.g = gi; $('#sheet').dataset.id = '';
  $('#sheetbg').classList.add('show');
}
function playGroup(gi) {
  const o = lastGroups[gi]; if (!o || !o.ids.length) return;
  shuffleOn = false; updateButtons();
  startQueue(o.ids.slice(), o.ids[0]);
}
function openEditForm(id) {
  const t = byId(id); if (!t) return;
  const albums = [...new Set(tracks.map(x => (x.album || '').trim()).filter(Boolean))];
  $('#sheet').innerHTML = `<div class="sh-title">Изменить данные</div>
    <label class="fl">Название</label><input id="fTitle" value="${esc(t.title)}">
    <label class="fl">Исполнитель</label><input id="fArtist" value="${esc(t.artist || '')}">
    <label class="fl">Альбом (впиши так же, как у других треков, чтобы они собрались вместе)</label>
    <input id="fAlbum" list="albumList" value="${esc(t.album || '')}"><datalist id="albumList">${albums.map(a => `<option value="${esc(a)}">`).join('')}</datalist>
    <div class="two"><div><label class="fl">№ трека</label><input id="fTrack" type="number" inputmode="numeric" min="0" value="${t.trackNo || ''}"></div>
    <div><label class="fl">№ диска</label><input id="fDisc" type="number" inputmode="numeric" min="0" value="${t.discNo || ''}"></div></div>
    <button class="primary" data-act="save-edit">Сохранить</button><button data-act="cancel">Отмена</button>`;
}
function openAlbumForm(gi) {
  const o = lastGroups[gi]; if (!o) return;
  $('#sheet').innerHTML = `<div class="sh-title">Альбом</div>
    <label class="fl">Название альбома</label><input id="aName" value="${esc(o.name)}">
    <label class="fl">Исполнитель альбома</label><input id="aArtist" value="${esc(o.artist === 'Разные исполнители' ? '' : o.artist)}">
    <button class="primary" data-act="save-album">Сохранить</button><button data-act="cancel">Отмена</button>`;
}
async function saveEdit(id) {
  const t = byId(id); if (!t) return;
  const v = s => $(s).value.trim();
  t.title = v('#fTitle') || t.title; t.artist = v('#fArtist'); t.album = v('#fAlbum');
  t.trackNo = parseInt(v('#fTrack'), 10) || 0; t.discNo = parseInt(v('#fDisc'), 10) || 0;
  try { await putMetas([t]); } catch (e) { toast('Не удалось сохранить'); return; }
  closeSheet(); render(); toast('Сохранено');
  if (curId === id) getByKey('covers', id).then(c => showMeta(t, c || null)).catch(() => {});
}
async function saveAlbum(gi) {
  const o = lastGroups[gi]; if (!o) return;
  const name = $('#aName').value.trim(), art = $('#aArtist').value.trim();
  if (!name) { toast('Введи название альбома'); return; }
  const list = o.ids.map(byId).filter(Boolean);
  list.forEach(t => { t.album = name; if (art) t.albumArtist = art; });
  try { await putMetas(list); } catch (e) { toast('Не удалось сохранить'); return; }
  closeSheet(); render(); toast('Сохранено');
}
/* порядок треков альбома вручную: перетаскивание за ручку «≡» (или стрелки) */
let roIds = [], roBuild = false, roChecked = new Set();
function drawReorder() {
  const box = $('#rolist'), st = box.scrollTop;
  let c = 0;
  box.innerHTML = roIds.map((id, i) => {
    const t = byId(id), on = roChecked.has(id);
    return `<div class="ro" data-id="${id}">
      ${roBuild ? `<input type="checkbox" class="ck" data-ck="${id}" ${on ? 'checked' : ''}>` : ''}
      <div class="n">${roBuild ? (on ? ++c : '–') : i + 1}</div>
      <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist || '')}</div></div>
      <button data-up="${i}" aria-label="Выше">${ICON.up}</button><button data-down="${i}" aria-label="Ниже">${ICON.down}</button>
      <div class="grip" aria-label="Перетащить">${ICON.grip}</div></div>`;
  }).join('');
  box.scrollTop = st;
}
function openReorder(gi) {
  const o = lastGroups[gi]; if (!o) return;
  roIds = o.ids.slice(); roBuild = !o.key; roChecked = new Set(roIds);
  $('#roTitle').textContent = roBuild ? 'Собрать альбом' : o.name;
  $('#roForm').style.display = roBuild ? 'block' : 'none';
  $('#roHint').textContent = roBuild
    ? 'Отметь нужные треки, впиши название альбома и расставь треки: тяни за «≡» вверх или вниз.'
    : 'Тяни трек за «≡» на нужное место (или жми стрелки). Музыка при этом не играет.';
  if (roBuild) {
    $('#roAlbum').value = '';
    const artists = new Set(roIds.map(id => (byId(id).artist || '').trim()).filter(Boolean));
    $('#roArtist').value = artists.size === 1 ? [...artists][0] : '';
  }
  drawReorder(); $('#reorder').classList.add('show');
}
$('#rolist').addEventListener('click', e => {
  const ck = e.target.closest('[data-ck]');
  if (ck) { const id = Number(ck.dataset.ck); if (ck.checked) roChecked.add(id); else roChecked.delete(id); drawReorder(); return; }
  const u = e.target.closest('[data-up]'), d = e.target.closest('[data-down]');
  let i, j;
  if (u) { i = Number(u.dataset.up); j = i - 1; } else if (d) { i = Number(d.dataset.down); j = i + 1; } else return;
  if (j < 0 || j >= roIds.length) return;
  [roIds[i], roIds[j]] = [roIds[j], roIds[i]]; drawReorder();
});
// перетаскивание: сам трек едет за пальцем, остальные расступаются; порядок применяется, когда отпустил
let drag = null, dragTimer = null;
function dragUpdate() {
  const d = drag, box = $('#rolist');
  const dy = (d.y - d.startY) + (box.scrollTop - d.scroll0);
  d.row.style.transform = `translateY(${dy}px)`;
  d.target = Math.max(0, Math.min(d.rows.length - 1, Math.floor((d.top0 + dy + d.h / 2) / d.h)));
  d.rows.forEach((r, i) => {
    if (i === d.idx) return;
    let s = 0;
    if (d.idx < d.target && i > d.idx && i <= d.target) s = -d.h;
    else if (d.target < d.idx && i >= d.target && i < d.idx) s = d.h;
    r.style.transform = s ? `translateY(${s}px)` : '';
  });
}
$('#rolist').addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g || drag) return;
  e.preventDefault();
  const box = $('#rolist'), row = g.closest('.ro'), rows = [...box.children], idx = rows.indexOf(row);
  drag = { row, rows, idx, target: idx, h: row.offsetHeight, top0: row.offsetTop, startY: e.clientY, y: e.clientY, scroll0: box.scrollTop, pid: e.pointerId };
  try { g.setPointerCapture(e.pointerId); } catch (_) {}
  rows.forEach(r => { if (r !== row) r.classList.add('shift'); });
  row.classList.add('drag');
  clearInterval(dragTimer);
  dragTimer = setInterval(() => { // прокрутка списка, когда палец у края
    if (!drag) return;
    const br = box.getBoundingClientRect(); let s = 0;
    if (drag.y < br.top + 50) s = -10; else if (drag.y > br.bottom - 50) s = 10;
    if (s) { const before = box.scrollTop; box.scrollTop += s; if (box.scrollTop !== before) dragUpdate(); }
  }, 16);
  dragUpdate();
});
$('#rolist').addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.pid) return; drag.y = e.clientY; dragUpdate(); });
function endDrag(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  clearInterval(dragTimer);
  const { idx, target } = drag; drag = null;
  const ids = roIds.slice(); const [m] = ids.splice(idx, 1); ids.splice(target, 0, m); roIds = ids;
  drawReorder();
}
$('#rolist').addEventListener('pointerup', endDrag);
$('#rolist').addEventListener('pointercancel', endDrag);
$('#roCancel').onclick = () => $('#reorder').classList.remove('show');
$('#roSave').onclick = async () => {
  let list;
  if (roBuild) {
    const name = $('#roAlbum').value.trim(), art = $('#roArtist').value.trim();
    const ids = roIds.filter(id => roChecked.has(id));
    if (!ids.length) { toast('Отметь хотя бы один трек'); return; }
    if (!name) { toast('Впиши название альбома'); return; }
    list = ids.map((id, i) => { const t = byId(id); t.album = name; t.trackNo = i + 1; t.discNo = 1; if (art) t.albumArtist = art; return t; });
  } else {
    list = roIds.map((id, i) => { const t = byId(id); t.trackNo = i + 1; t.discNo = 1; return t; });
  }
  try { await putMetas(list); } catch (e) { toast('Не удалось сохранить'); return; }
  $('#reorder').classList.remove('show'); render(); toast(roBuild ? 'Альбом собран' : 'Порядок сохранён');
};
function closeSheet() { $('#sheetbg').classList.remove('show'); }
$('#sheetbg').addEventListener('click', async e => {
  if (e.target === $('#sheetbg')) { closeSheet(); return; }
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const sh = $('#sheet'), id = Number(sh.dataset.id), gi = Number(sh.dataset.g), act = b.dataset.act;
  if (act === 'cancel') { closeSheet(); return; }
  if (act === 'edit') { openEditForm(id); return; }
  if (act === 'save-edit') { await saveEdit(id); return; }
  if (act === 'arename') { openAlbumForm(gi); return; }
  if (act === 'save-album') { await saveAlbum(gi); return; }
  closeSheet();
  if (act === 'aplay') { playGroup(gi); return; }
  if (act === 'areorder') { openReorder(gi); return; }
  if (act === 'next') {
    if (!order.length) { startQueue([id], id); return; }
    order = order.filter(x => x !== id); base = base.filter(x => x !== id);
    const cp = Math.max(0, order.indexOf(curId));
    order.splice(cp + 1, 0, id); pos = cp;
    if (!base.includes(id)) base.push(id);
    toast('Сыграет следующим');
  } else if (act === 'delete') {
    try { await deleteTrack(id); } catch (e) { toast('Не удалось удалить'); return; }
    tracks = tracks.filter(t => t.id !== id);
    order = order.filter(x => x !== id); base = base.filter(x => x !== id);
    if (curId === id) {
      if (order.length) { pos = Math.min(pos, order.length - 1); loadAndPlay(order[pos]); }
      else { curId = null; loadToken++; audio.pause(); audio.removeAttribute('src'); $('#mini').classList.remove('show'); $('#full').classList.remove('open'); updateButtons(); }
    } else pos = Math.max(0, order.indexOf(curId));
    render(); toast('Удалено');
  }
});

/* ---------- start ---------- */
(async function init() {
  const sort = lsGet('sort'); if (sort) $('#sort').value = sort;
  shuffleOn = lsGet('shuffle') === '1'; repeatMode = Number(lsGet('repeat') || 0);
  updateButtons();
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (ios && !standalone && lsGet('tipx') !== '1') $('#tip').classList.add('show');
  $('#tipx').onclick = () => { $('#tip').classList.remove('show'); lsSet('tipx', '1'); };
  try {
    db = await openDB();
    tracks = await getAllMeta();
  } catch (e) {
    toast('Не удалось открыть хранилище. Не используй приватный режим Safari.', 6000);
  }
  render();
  migrate();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
